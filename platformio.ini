; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
board_build.arduino.upstream_packages = no
board_build.partitions = tinyuf2-partitions-4MB.csv
lib_deps = 
	dvarrel/AHT20@^1.0.2
	bodmer/TFT_eSPI@^2.5.43
	br3ttb/PID@^1.2.1
platform_packages =
  espressif/toolchain-xtensa-esp32s3 @ 12.2.0+20230208
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.7
  framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-lib-builder/releases/download/idf-release_v5.1/esp32-arduino-libs-idf-release_v5.1-632e0c2a.zip
