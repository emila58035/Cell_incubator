; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Optional per-machine credentials. PlatformIO only reads extra_configs from
; this section, not from an env section. A missing file is fine: the pattern is
; globbed, and the [secrets] fallback below keeps a fresh clone buildable.
extra_configs = ${PROJECT_DIR}/secrets.ini

[env:adafruit_feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino

; TFT_eSPI reads its driver and pin setup from its own library folder by
; default. That copy is inside .pio (gitignored) and had been edited by hand,
; so a fresh clone silently built a different display configuration.
; USER_SETUP_LOADED stops the library from loading its own User_Setup.h;
; -include loads the repository copy for every translation unit.
build_flags =
	-DUSER_SETUP_LOADED=1
	-include "${PROJECT_DIR}/src/User_Setup.h"
	${secrets.build_flags}

board_build.arduino.upstream_packages = no
; The board carries 8 MB of flash. The Adafruit board definition inherits a
; 4 MB table and a 4 MB flash size, which would cap the app slot at 1,408 KB;
; this table gives 2,048 KB per OTA slot. nvs and otadata keep their offsets
; (0x9000 / 0xe000), so saved settings survive the switch, but ota_1 moves from
; 0x170000 to 0x210000 - erase the flash before the first upload after this
; change so a stale otadata cannot point at the old slot.
board_build.partitions = tinyuf2-partitions-8MB.csv
board_upload.flash_size = 8MB
lib_deps = 
	robtillaart/SHT85@^0.6.3
	bodmer/TFT_eSPI@^2.5.43
	br3ttb/PID@^1.2.1
platform_packages =
  espressif/toolchain-xtensa-esp32s3 @ 12.2.0+20230208
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.7
  framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-lib-builder/releases/download/idf-release_v5.1/esp32-arduino-libs-idf-release_v5.1-632e0c2a.zip

; Fallback credentials so that a clone without secrets.ini still compiles.
; secrets.ini is gitignored and, being an extra_configs file, is read after
; this one - so it overrides the value below. Empty strings mean "not
; configured": the firmware then reports nothing instead of retrying.
[secrets]
build_flags =
	-DSECRET_WIFI_SSID=\"\"
	-DSECRET_WIFI_PASS=\"\"
	-DSECRET_SERVER_URL=\"\"
	-DSECRET_DEVICE_ID=\"\"
	-DSECRET_DEVICE_TOKEN=\"\"
