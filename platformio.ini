; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain `pio run` must keep building the production image only; the [env:sim]
; development environment is built explicitly with `pio run -e sim`.
default_envs = adafruit_feather_esp32s3

[env:adafruit_feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino

; TFT_eSPI reads its driver and pin setup from its own library folder by
; default. That copy is inside .pio (gitignored) and had been edited by hand,
; so a fresh clone silently built a different display configuration.
; USER_SETUP_LOADED stops the library from loading its own User_Setup.h;
; -include loads the repository copy for every translation unit.
build_flags =
	-DUSER_SETUP_LOADED=1
	-include "${PROJECT_DIR}/src/User_Setup.h"
	; The board carries a CH340K on UART0 for download and debug, and the vendor
	; firmware logged there. The Adafruit board definition sends Serial to the
	; native USB CDC instead, where output is dropped unless a host happens to be
	; attached before boot and the port number changes on every reset. Route
	; Serial back to UART0 so one stable port (the CH340K) carries the ROM
	; banner, the IDF console and the sketch logs together.
	-DARDUINO_USB_CDC_ON_BOOT=0
	-I"${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32s3/include/esp_websocket_client/include"
extra_scripts = post:extra_script.py

; The board definition sets this to 1 through its extra_flags.
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1

; The Adafruit definition drives the upload through a 1200bps touch and then
; waits for a new port to appear. This board downloads through a CH340K with an
; auto-reset circuit instead, so that sequence reboots the chip, lets the native
; USB device re-enumerate under a new COM number, and then fails to configure
; it. esptool's normal reset path on the CH340K works and is what we want.
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = false

monitor_speed = 115200

; The simulator source is compiled out of the production image entirely, so its
; absence is structural rather than a link-time-garbage-collection accident.
; The [env:sim] environment restores the default filter.
;
; src/SHT20Sensor.cpp and src/SHT30Sensor.cpp are parked alternative climate
; drivers. They are kept in the tree for reference but are not part of the
; build, so they are excluded in both environments and neither robtillaart/SHT2x
; nor robtillaart/SHT85 is in lib_deps.
build_src_filter = +<*> -<SensorSimulator.cpp> -<SHT20Sensor.cpp> -<SHT30Sensor.cpp>

board_build.arduino.upstream_packages = no
; The board carries 8 MB of flash. The Adafruit board definition inherits a
; 4 MB table and a 4 MB flash size, which would cap the app slot at 1,408 KB;
; this table gives 2,048 KB per OTA slot. nvs and otadata keep their offsets
; (0x9000 / 0xe000), so saved settings survive the switch, but ota_1 moves from
; 0x170000 to 0x210000 - erase the flash before the first upload after this
; change so a stale otadata cannot point at the old slot.
board_build.partitions = tinyuf2-partitions-8MB.csv
board_upload.flash_size = 8MB
lib_deps = 
	dvarrel/AHT20@^1.0.2
	bodmer/TFT_eSPI@^2.5.43
	br3ttb/PID@^1.2.1
platform_packages =
  espressif/toolchain-xtensa-esp32s3 @ 12.2.0+20230208
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.7
  framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-lib-builder/releases/download/idf-release_v5.1/esp32-arduino-libs-idf-release_v5.1-632e0c2a.zip

; Credentials are NOT injected as -D flags any more. PlatformIO splits
; build_flags with a shell-like parser, and that parser cannot carry a space:
; -DSECRET_WIFI_SSID="has space" splits into two tokens and the build fails with
; a missing terminating quote. Backslash escapes do not help either, they are
; consumed before the compiler sees them. The INI layer adds two more traps:
; a value containing # or ; is truncated as an inline comment.
;
; src/Secrets.h (gitignored, template next to it) is the supported path, the
; same one src/ServerCaCert.h already uses. See docs/REMOTE_ACCESS.md 6.4.

; Development build without sensors: SensorSimulator feeds synthetic readings into
; SystemState so the telemetry path can be exercised on a bare board. The PID,
; the valve logic, the display and the payload all stay real - only the sensor
; readings are fabricated.
;
; NEVER flash this to a board with heaters or valves connected: the synthetic
; temperature makes the PID drive real outputs. The image reports firmware
; version 0.1.0-sim, so simulated samples stay recognisable in the database.
;
; It also prints the payload on serial, including while the link is down, so the
; server contract can be checked with no access point and no credentials.
[env:sim]
extends = env:adafruit_feather_esp32s3
build_flags = ${env:adafruit_feather_esp32s3.build_flags} -DSENSOR_SIMULATION=1
build_src_filter = +<*> -<SHT20Sensor.cpp> -<SHT30Sensor.cpp>
