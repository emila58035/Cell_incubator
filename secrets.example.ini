; Copy this file to secrets.ini (gitignored) and fill in the real values.
;
; platformio.ini pulls it in through `extra_configs` and interpolates
; ${secrets.build_flags} into the build flags. When secrets.ini is absent the
; placeholders inside platformio.ini are used, so a fresh clone still builds
; and the firmware simply reports nothing.
;
; Where the values come from: docs/REMOTE_ACCESS.md section 2.4 and
; server/README.md. The device token lives on the server in
; /etc/incubator/devices.json and was printed once by the install script; it is
; never stored in this repository.
;
; Escaping: keep the \" form so the C string stays well formed. A value that
; contains $ # ; or " must be escaped for both this INI file and the shell that
; PlatformIO uses to split the flags.
[secrets]
build_flags =
	-DSECRET_WIFI_SSID=\"your-ssid\"
	-DSECRET_WIFI_PASS=\"your-password\"
	-DSECRET_SERVER_URL=\"https://<server-address>/api/v1/telemetry\"
	-DSECRET_DEVICE_ID=\"incubator-001\"
	-DSECRET_DEVICE_TOKEN=\"<64 hex characters from /etc/incubator/devices.json>\"