# Incubator HTTPS front end (IP direct, no domain).
#
# Installed as a NEW file: /etc/nginx/conf.d/incubator-https.conf
# Nothing else in conf.d is modified, so the existing 80-port dashboard stub in
# incubator.conf and the /fw/ OTA service in ota.conf are untouched. To roll
# back, delete this file and run `sudo systemctl reload nginx`.
#
# Notes that are easy to get wrong:
#   * nginx here is 1.24.0, which does NOT understand `http2 on;` (1.25.1+ only)
#     and would fail `nginx -t`, so HTTP/2 is deliberately not enabled.
#   * The htpasswd file lives under /etc/nginx rather than /etc/incubator
#     because /etc/incubator is 0750 root:incubator and the nginx worker runs as
#     www-data. An unreadable htpasswd yields a 403 whose cause is not obvious.
#   * limit_req_zone must sit in the http context; conf.d/*.conf is included
#     there, so declaring it at the top of this file is correct.

limit_req_zone $binary_remote_addr zone=telemetry:1m rate=20r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # IP direct: no domain in server_name, which is also why the Tencent Cloud
    # unregistered-domain interception never matches (HANDOFF 5.5.2).
    server_name 175.24.182.190;

    ssl_certificate     /etc/incubator/certs/server.pem;
    ssl_certificate_key /etc/incubator/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Session cache keeps the ESP32 from paying a full handshake every reconnect.
    ssl_session_cache   shared:IncubatorTLS:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Device upload. No Basic Auth here (the device carries its own Bearer
    # token); rate limited because the endpoint is on a bare public IP.
    location /api/v1/telemetry {
        auth_basic off;
        client_max_body_size 4k;
        limit_req zone=telemetry burst=10 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Dashboard and every query endpoint. Basic Auth is mandatory: a bare IP has
    # no name to hide behind and is scanned continuously (REMOTE_MONITORING 7).
    location / {
        auth_basic "Incubator";
        auth_basic_user_file /etc/nginx/incubator.htpasswd;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}